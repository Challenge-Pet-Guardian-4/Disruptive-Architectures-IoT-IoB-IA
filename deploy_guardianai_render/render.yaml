services:
  - type: web
    name: petguardian-ai
    runtime: python
    region: oregon
    plan: free
    rootDir: deploy_guardianai_render
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
